name: mplayer
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  path_provider: ^2.1.6
  path: ^1.9.1
  dio: ^5.11.0
  chopper: ^8.7.0
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
  google_fonts: ^8.2.1
  dynamic_color: ^2.1.0
  animations: ^3.0.0
  google_generative_ai: ^0.4.7
  audio_service: ^0.18.19
  just_audio: ^0.10.6
  workmanager: ^0.10.9
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  audio_session: ^0.2.4
  permission_handler: ^13.0.1
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  flutter_animate: ^4.5.2
  go_router: ^18.0.0
  drift: ^2.34.3
  audio_metadata_reader: ^1.7.1
  home_widget: ^0.9.3
  palette_generator: ^0.3.3+7
  webview_flutter: ^4.14.1
  youtube_explode_dart: ^3.1.0
  flutter_secure_storage: ^11.0.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  riverpod_generator: ^4.0.8
  chopper_generator: ^8.7.0
  json_serializable: ^6.14.1
  freezed: ^4.0.0
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#303030"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#303030"
    theme_color: "#303030"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
